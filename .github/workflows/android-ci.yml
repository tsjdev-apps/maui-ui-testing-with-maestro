name: Android CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json

      - name: Run Core unit tests
        id: unit-tests
        run: >-
          dotnet test tests/MaestroMauiDemo.UnitTests/MaestroMauiDemo.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory "$RUNNER_TEMP/unit-tests"

      - name: Upload unit-test report
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/unit-tests/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Install required Android SDK components
        run: >-
          dotnet build src/MaestroMauiDemo/MaestroMauiDemo.csproj
          -t:InstallAndroidDependencies
          --framework net10.0-android
          --configuration Debug
          "-p:AndroidSdkDirectory=$ANDROID_HOME"
          "-p:JavaSdkDirectory=$JAVA_HOME"
          -p:AcceptAndroidSdkLicenses=true

      - name: Build Android app
        run: >-
          dotnet build src/MaestroMauiDemo/MaestroMauiDemo.csproj
          --framework net10.0-android
          --configuration Debug
          "-p:AndroidSdkDirectory=$ANDROID_HOME"
          "-p:JavaSdkDirectory=$JAVA_HOME"
          --no-restore
