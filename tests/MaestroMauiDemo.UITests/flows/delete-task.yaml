appId: ${APP_ID}
name: Delete a seeded task without removing other tasks
---
- launchApp:
    clearState: true
- assertVisible:
    id: "TaskList"
- assertVisible:
    id: "TaskTitleLabel"
    text: "Write UI tests"
- tapOn:
    id: "DeleteTaskButton"
    text: "Delete task: Write UI tests"
- assertNotVisible:
    id: "TaskTitleLabel"
    text: "Write UI tests"
- assertVisible:
    id: "TaskTitleLabel"
    text: 'Learn \.NET MAUI'
- assertVisible:
    id: "TaskTitleLabel"
    text: "Explore Maestro"
- assertVisible:
    id: "AddTaskButton"
