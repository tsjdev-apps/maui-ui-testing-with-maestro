appId: ${APP_ID}
name: Add a task and return to the list
---
- launchApp:
    clearState: true
- assertVisible:
    id: "TaskList"
- assertNotVisible: "Write Maestro UI tests"
- tapOn:
    id: "AddTaskButton"
- assertVisible: "A new task"
- tapOn:
    id: "TaskTitleEntry"
- inputText: "Write Maestro UI tests"
- hideKeyboard
- tapOn:
    id: "SaveTaskButton"
- assertVisible:
    id: "TaskList"
- assertNotVisible:
    id: "TaskTitleEntry"
- scrollUntilVisible:
    element:
      id: "TaskTitleLabel"
      text: "Write Maestro UI tests"
- assertVisible:
    id: "TaskTitleLabel"
    text: "Write Maestro UI tests"
